name: Browser beta checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check app and export browser beta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_URL: https://mova.dehimik.org/v1
      EXPO_PUBLIC_WS_URL: wss://mova.dehimik.org
      EXPO_PUBLIC_BETA_ONLY: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prepush
      - run: npx expo export --platform web --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: browser-beta
          path: dist
          retention-days: 7
